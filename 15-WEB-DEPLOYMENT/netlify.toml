# Netlify Production Configuration — The Small Business AI Automation Operating System
[build]
  publish = "dist"
  command = "echo 'Static bundle pre-compiled in dist/'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/companion"
  to = "/app/index.html"
  status = 301

[[redirects]]
  from = "/customizer"
  to = "/studio/index.html"
  status = 301

[[redirects]]
  from = "/free-audit"
  to = "/downloads/Tier0-Free-5Day-Audit-Starter-Kit.zip"
  status = 302
