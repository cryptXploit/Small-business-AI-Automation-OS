  <text x="450" y="367" fill="#0F172A" font-size="10.5" font-weight="700" text-anchor="middle">AUDITED CASHFLOW BENCHMARKS</text>
  <text x="450" y="385" fill="#059669" font-size="10" font-weight="600" text-anchor="middle">DSO Reduced: 44 Days -&gt; 14 Days</text>
  <text x="450" y="402" fill="#0284C7" font-size="10" font-weight="600" text-anchor="middle">$68,000 Aged AR Recovered in 60d</text>
