<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow09f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#64748B"/>
    </marker>
    <marker id="arrowGreen09f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber09f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#D97706"/>
    </marker>
    <filter id="shadow09f" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- White Canvas -->
  <rect width="900" height="480" fill="#FFFFFF"/>

  <!-- Top Banner -->
  <rect x="0" y="0" width="900" height="52" fill="#0F172A"/>
  <text x="24" y="23" fill="#FFFFFF" font-size="13.5" font-weight="700">CHAPTER 9 DECISION TREE — VOICE-TO-SOP CAPTURE, STAFF Q&amp;A BOT &amp; DELEGATION FLYWHEEL</text>
  <text x="24" y="40" fill="#64748B" font-size="10.5">How Staff Questions &amp; Owner Voice Notes Automatically Build and Update the Company Operations Manual</text>
  <rect x="726" y="13" width="150" height="26" rx="13" fill="#0284C7"/>
  <text x="801" y="30" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">SELF-HEALING SOP VAULT</text>

  <!-- ==================== TOP PIPELINE: VOICE / LOOM TO LIVING SOP ==================== -->
  <rect x="20" y="64" width="860" height="156" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="20" y="64" width="860" height="24" rx="6" fill="#0F172A"/>
  <text x="34" y="80" fill="#FFFFFF" font-size="10" font-weight="700">PIPELINE A: 5-MINUTE VOICE / SCREEN CAPTURE TO VERIFIED LIVING SOP &amp; NEW-HIRE QUIZ (PROMPTS 9.1 &amp; 9.5)</text>

  <!-- Node A1 -->
  <g filter="url(#shadow09f)">
    <rect x="34" y="102" width="176" height="98" rx="8" fill="#0F172A"/>
    <text x="122" y="124" fill="#38BDF8" font-size="9.5" font-weight="700" text-anchor="middle">STEP 1: RAW CAPTURE</text>
    <text x="122" y="142" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">3-Min Loom / Voice Note</text>
    <text x="122" y="160" fill="#E2E8F0" font-size="9.5" text-anchor="middle">Owner or Senior Tech narrates</text>
    <text x="122" y="175" fill="#10B981" font-size="9" font-weight="600" text-anchor="middle">while doing task in real time</text>
  </g>
  <line x1="210" y1="151" x2="240" y2="151" stroke="#64748B" stroke-width="2" marker-end="url(#arrow09f)"/>

  <!-- Node A2 -->
  <g filter="url(#shadow09f)">
    <rect x="246" y="102" width="196" height="98" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <text x="344" y="124" fill="#0284C7" font-size="9.5" font-weight="700" text-anchor="middle">STEP 2: SOP COMPILER (9.1)</text>
    <text x="344" y="142" fill="#0F172A" font-size="10.5" font-weight="700" text-anchor="middle">Structure 7-Block SOP</text>
    <text x="344" y="159" fill="#1E293B" font-size="9.5" text-anchor="middle">• Numbered Action Checklist</text>
    <text x="344" y="175" fill="#1E293B" font-size="9.5" text-anchor="middle">• Quantified Definition of Done</text>
    <text x="344" y="191" fill="#64748B" font-size="9" text-anchor="middle">• Exceptions &amp; Escalation Role</text>
  </g>
  <line x1="442" y1="151" x2="472" y2="151" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber09f)"/>

  <!-- Node A3: Amber Review Gate -->
  <g filter="url(#shadow09f)">
    <rect x="478" y="102" width="166" height="98" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="561" y="124" fill="#D97706" font-size="9.5" font-weight="700" text-anchor="middle">STEP 3: AMBER SIGN-OFF</text>
    <text x="561" y="142" fill="#0F172A" font-size="10.5" font-weight="700" text-anchor="middle">60-Second Owner Check</text>
    <text x="561" y="159" fill="#1E293B" font-size="9.5" text-anchor="middle">Verify safety boundaries</text>
    <text x="561" y="175" fill="#D97706" font-size="9.5" font-weight="700" text-anchor="middle">1-Click Approve to Vault</text>
  </g>
  <line x1="644" y1="151" x2="674" y2="151" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen09f)"/>

  <!-- Node A4: Index in Vault + Quiz -->
  <g filter="url(#shadow09f)">
    <rect x="680" y="102" width="184" height="98" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="772" y="124" fill="#059669" font-size="9.5" font-weight="700" text-anchor="middle">STEP 4: PUBLISH &amp; TRAIN (9.5)</text>
    <text x="772" y="142" fill="#0F172A" font-size="10.5" font-weight="700" text-anchor="middle">Index in Living SOP Vault</text>
    <text x="772" y="159" fill="#1E293B" font-size="9.5" text-anchor="middle">• Sync to Staff Q&amp;A Bot (9.4)</text>
    <text x="772" y="175" fill="#1E293B" font-size="9.5" text-anchor="middle">• Generate 3-Question Quiz</text>
    <text x="772" y="191" fill="#059669" font-size="9" font-weight="700" text-anchor="middle">• Attach to Task Template</text>
  </g>

  <!-- ==================== BOTTOM PIPELINE: STAFF QUESTION TRIAGE & DELEGATION ==================== -->
  <rect x="20" y="236" width="860" height="226" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="20" y="236" width="860" height="24" rx="6" fill="#0284C7"/>
  <text x="34" y="252" fill="#FFFFFF" font-size="10" font-weight="700">PIPELINE B: STAFF QUESTION TRIAGE — INTERNAL "ASK-THE-SOP" BOT VS. OWNER ESCALATION LOOP (PROMPT 9.4)</text>

  <!-- Node B1: Staff Question -->
  <g filter="url(#shadow09f)">
    <rect x="34" y="286" width="176" height="84" rx="8" fill="#0F172A"/>
    <text x="122" y="308" fill="#38BDF8" font-size="9.5" font-weight="700" text-anchor="middle">STAFF QUESTION</text>
    <text x="122" y="326" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">Posted in #ask-the-sop</text>
    <text x="122" y="344" fill="#E2E8F0" font-size="9" text-anchor="middle">"How do we handle a</text>
    <text x="122" y="358" fill="#E2E8F0" font-size="9" text-anchor="middle">rush warranty replacement?"</text>
  </g>
  <line x1="210" y1="328" x2="244" y2="328" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow09f)"/>

  <!-- Node B2: Decision Gate (SOP Match?) -->
  <g filter="url(#shadow09f)">
    <rect x="250" y="278" width="210" height="100" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <rect x="250" y="278" width="210" height="22" rx="6" fill="#0284C7"/>
    <text x="355" y="293" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">GROUNDED SOP GATE (PROMPT 9.4)</text>
    <text x="355" y="318" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">Verified SOP Exists in Vault</text>
    <text x="355" y="334" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">&amp; Confidence &gt;= 0.90?</text>
    <text x="355" y="354" fill="#64748B" font-size="9" text-anchor="middle">Searches Approved 7-Block SOPs</text>
  </g>

  <!-- Branch B-YES (Green): Instant Staff Resolution -->
  <path d="M 460 306 L 516 306" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen09f)"/>
  <text x="488" y="298" fill="#059669" font-size="9.5" font-weight="700" text-anchor="middle">YES</text>

  <g filter="url(#shadow09f)">
    <rect x="522" y="272" width="342" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="693" y="292" fill="#059669" font-size="10" font-weight="700" text-anchor="middle">GREEN ZONE: INSTANT GROUNDED ANSWER (&lt; 10 SEC)</text>
    <text x="536" y="310" fill="#0F172A" font-size="9.5" font-weight="600">• Cites Exact `SOP-ID` + Step-by-Step Checklist + Direct Link</text>
    <text x="536" y="326" fill="#1E293B" font-size="9.5">• Reminds staff of "Definition of Done" QA criteria</text>
    <text x="536" y="342" fill="#059669" font-size="9.5" font-weight="700">• Result: Owner Never Interrupted (Saves 14+ Interrupts/Day)</text>
  </g>

  <!-- Branch B-NO (Amber): Escalate & Capture Missing SOP -->
  <path d="M 460 356 L 490 356 L 490 406 L 516 406" stroke="#D97706" stroke-width="2.5" fill="none" marker-end="url(#arrowAmber09f)"/>
  <text x="478" y="395" fill="#D97706" font-size="9" font-weight="700" text-anchor="middle">NO</text>

  <g filter="url(#shadow09f)">
    <rect x="522" y="364" width="342" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="693" y="384" fill="#D97706" font-size="10" font-weight="700" text-anchor="middle">AMBER ZONE: SOP GAP DETECTED -&gt; CAPTURE ONCE</text>
    <text x="536" y="402" fill="#0F172A" font-size="9.5" font-weight="600">• Bot never guesses; tags Department Lead / Owner with question</text>
    <text x="536" y="418" fill="#1E293B" font-size="9.5">• Owner replies with a 60-second voice note in Slack/Teams</text>
    <text x="536" y="434" fill="#D97706" font-size="9.5" font-weight="700">• `Prompt 9.1` Auto-Compiles Reply into New Permanent SOP Chunk!</text>
  </g>

  <!-- Bottom Left Feedback Loop Note -->
  <rect x="34" y="384" width="426" height="64" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
  <text x="247" y="404" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">THE COMPOUNDING DELEGATION LAW</text>
  <text x="247" y="421" fill="#1E293B" font-size="9.5" text-anchor="middle">Every unindexed question answered once via voice note becomes a permanent</text>
  <text x="247" y="436" fill="#0284C7" font-size="9.5" font-weight="700" text-anchor="middle">SOP in Pipeline A—ensuring the owner never answers the same question twice.</text>
</svg>
