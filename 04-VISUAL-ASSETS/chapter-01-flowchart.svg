<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="fc-arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F172A" />
    </marker>
    <marker id="fc-arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="fc-arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="fc-arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706" />
    </marker>
    <filter id="fc-shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.09" />
    </filter>
  </defs>

  <!-- Canvas & Frame -->
  <rect x="0" y="0" width="900" height="480" fill="#FFFFFF" />
  <rect x="8" y="8" width="884" height="464" rx="10" fill="none" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Top Header Banner -->
  <rect x="8" y="8" width="884" height="46" rx="10" fill="#0F172A" />
  <rect x="8" y="38" width="884" height="16" fill="#0F172A" />
  <text x="26" y="31" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="0.4">CHAPTER 1 DECISION TREE — BOTTLENECK TRIAGE &amp; A.U.T.O. PRIORITIZATION FLOW</text>
  <text x="26" y="46" fill="#64748B" font-size="10" font-weight="500">Deterministic 4-Gate Routing from Raw 5-Day Task Audit to Unattended Automation, Human-in-the-Loop Draft, or Elimination</text>
  <rect x="738" y="18" width="138" height="24" rx="12" fill="#0284C7" />
  <text x="807" y="34" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">A.U.T.O. MATRIX</text>

  <!-- STEP 0: INPUT NODE (LEFT) -->
  <g filter="url(#fc-shadow)">
    <rect x="24" y="82" width="175" height="86" rx="8" fill="#0F172A" stroke="#059669" stroke-width="2" />
    <text x="111" y="103" fill="#059669" font-size="9.5" font-weight="700" text-anchor="middle">INPUT: 5-DAY AUDIT LOG</text>
    <text x="111" y="121" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Raw Manual Task or</text>
    <text x="111" y="136" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Lead-Leak Friction</text>
    <text x="111" y="154" fill="#CBD5E1" font-size="9" text-anchor="middle">Assigned to Dept 01–05</text>
  </g>

  <!-- Arrow Step 0 -> Gate 1 -->
  <line x1="199" y1="125" x2="236" y2="125" stroke="#0F172A" stroke-width="2" marker-end="url(#fc-arrow-dark)" />

  <!-- GATE 1: VALUE & NECESSITY CHECK -->
  <g filter="url(#fc-shadow)">
    <rect x="242" y="76" width="190" height="98" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <rect x="242" y="76" width="190" height="24" rx="8" fill="#0284C7" />
    <rect x="242" y="90" width="190" height="10" fill="#0284C7" />
    <text x="337" y="92" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">GATE 1: NECESSITY AUDIT</text>
    <text x="337" y="114" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Does Task Drive Revenue,</text>
    <text x="337" y="129" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Cashflow, CSAT, or Compliance?</text>
    <text x="337" y="148" fill="#64748B" font-size="9" text-anchor="middle">Never automate zero-value</text>
    <text x="337" y="161" fill="#64748B" font-size="9" text-anchor="middle">legacy busywork or redundancy</text>
  </g>

  <!-- Gate 1 NO -> Eliminate Box (Below Gate 1) -->
  <line x1="337" y1="174" x2="337" y2="218" stroke="#64748B" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#fc-arrow-dark)" />
  <rect x="307" y="185" width="60" height="16" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1" />
  <text x="337" y="196" fill="#1E293B" font-size="8.5" font-weight="700" text-anchor="middle">NO (0 ROI)</text>

  <g filter="url(#fc-shadow)">
    <rect x="24" y="224" width="398" height="62" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" />
    <text x="38" y="244" fill="#0F172A" font-size="10" font-weight="700">OUTCOME A: ELIMINATE OR CONSOLIDATE IMMEDIATELY</text>
    <text x="38" y="261" fill="#1E293B" font-size="9.5">Kill redundant status meetings, duplicate spreadsheets, and unused fields.</text>
    <text x="38" y="276" fill="#64748B" font-size="9" font-weight="600">Action: Remove from staff checklist before building any software bridge.</text>
  </g>

  <!-- Gate 1 YES -> Gate 2 -->
  <line x1="432" y1="125" x2="478" y2="125" stroke="#059669" stroke-width="2.2" marker-end="url(#fc-arrow-emerald)" />
  <rect x="440" y="105" width="32" height="15" rx="3" fill="#059669" />
  <text x="456" y="116" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">YES</text>

  <!-- GATE 2: FREQUENCY, CMF & A.U.T.O. SCORE -->
  <g filter="url(#fc-shadow)">
    <rect x="484" y="76" width="196" height="98" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2" />
    <rect x="484" y="76" width="196" height="24" rx="8" fill="#059669" />
    <rect x="484" y="90" width="196" height="10" fill="#059669" />
    <text x="582" y="92" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">GATE 2: A.U.T.O. THRESHOLD</text>
    <text x="582" y="114" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Frequency &gt;= 3x/Wk OR</text>
    <text x="582" y="129" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">A.U.T.O. Score &gt;= 28 / 40?</text>
    <text x="582" y="148" fill="#1E293B" font-size="9" text-anchor="middle">Annual Cost + Urgency +</text>
    <text x="582" y="161" fill="#1E293B" font-size="9" text-anchor="middle">Tech Simplicity + Operational Safe</text>
  </g>

  <!-- Gate 2 NO -> Outcome B (Right of Gate 2) -->
  <line x1="680" y1="125" x2="716" y2="125" stroke="#0284C7" stroke-width="2" marker-end="url(#fc-arrow-cyan)" />
  <rect x="684" y="105" width="28" height="15" rx="3" fill="#0284C7" />
  <text x="698" y="116" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">NO</text>

  <g filter="url(#fc-shadow)">
    <rect x="722" y="76" width="154" height="98" rx="8" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.8" />
    <text x="799" y="96" fill="#0284C7" font-size="9.5" font-weight="700" text-anchor="middle">OUTCOME B: SOP ONLY</text>
    <text x="799" y="114" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">Standardize Checklist</text>
    <text x="799" y="129" fill="#1E293B" font-size="9" text-anchor="middle">Record 5-min Loom +</text>
    <text x="799" y="143" fill="#1E293B" font-size="9" text-anchor="middle">AI Prompt Template</text>
    <text x="799" y="159" fill="#64748B" font-size="8.5" font-weight="600" text-anchor="middle">Defer API Build to Day 60+</text>
  </g>

  <!-- Gate 2 YES -> Gate 3 (Downward from Gate 2) -->
  <line x1="582" y1="174" x2="582" y2="218" stroke="#059669" stroke-width="2.2" marker-end="url(#fc-arrow-emerald)" />
  <rect x="550" y="185" width="64" height="16" rx="4" fill="#059669" />
  <text x="582" y="196" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">YES (&gt;= 28)</text>

  <!-- GATE 3: INPUT/OUTPUT STANDARDIZATION GATE -->
  <g filter="url(#fc-shadow)">
    <rect x="445" y="224" width="274" height="74" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
    <rect x="445" y="224" width="274" height="22" rx="8" fill="#0F172A" />
    <rect x="445" y="236" width="274" height="10" fill="#0F172A" />
    <text x="582" y="239" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">GATE 3: SCHEMA STANDARDIZATION</text>
    <text x="582" y="260" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">Are Trigger Fields &amp; Rules Standardized?</text>
    <text x="582" y="276" fill="#1E293B" font-size="9" text-anchor="middle">If No -&gt; Run Prompt 1.3 &amp; Lock Input Form First</text>
    <text x="582" y="290" fill="#059669" font-size="9" font-weight="700" text-anchor="middle">If Yes -&gt; Proceed to Gate 4 (Risk Classification)</text>
  </g>

  <!-- Gate 3 -> Gate 4 (Downward) -->
  <line x1="582" y1="298" x2="582" y2="330" stroke="#D97706" stroke-width="2.2" marker-end="url(#fc-arrow-amber)" />

  <!-- GATE 4: T.R.A.V. FINANCIAL / REPUTATIONAL RISK EVALUATION -->
  <g filter="url(#fc-shadow)">
    <rect x="425" y="336" width="314" height="84" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2.2" />
    <rect x="425" y="336" width="314" height="24" rx="8" fill="#D97706" />
    <rect x="425" y="350" width="314" height="10" fill="#D97706" />
    <text x="582" y="352" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">GATE 4: T.R.A.V. RISK CLASSIFICATION</text>
    <text x="582" y="373" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Does Action Commit Custom Pricing, Legal</text>
    <text x="582" y="388" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Terms, Refunds, or Sensitive VIP Replies?</text>
    <text x="582" y="407" fill="#64748B" font-size="9" text-anchor="middle">Separates Safe Unattended Actions from Human Drafts</text>
  </g>

  <!-- Gate 4 -> LEFT: OUTCOME C (GREEN UNATTENDED AUTOMATION) -->
  <path d="M 425 378 L 385 378" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#fc-arrow-emerald)" />
  <rect x="387" y="356" width="36" height="16" rx="3" fill="#059669" />
  <text x="405" y="367" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">LOW</text>

  <g filter="url(#fc-shadow)">
    <rect x="24" y="310" width="355" height="114" rx="8" fill="#0F172A" stroke="#059669" stroke-width="2.2" />
    <rect x="36" y="322" width="185" height="20" rx="4" fill="#059669" />
    <text x="128" y="336" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">OUTCOME C: GREEN GATE (AUTO)</text>
    <text x="36" y="358" fill="#FFFFFF" font-size="10.5" font-weight="700">100% Unattended 24/7 Execution</text>
    <text x="36" y="375" fill="#CBD5E1" font-size="9.5">• 60-Second Missed-Call / Web Form SMS Intake</text>
    <text x="36" y="390" fill="#CBD5E1" font-size="9.5">• CRM Normalization, Folder Setup &amp; Tier-1 FAQs</text>
    <text x="36" y="405" fill="#CBD5E1" font-size="9.5">• Standard Invoice Reminders &amp; Friday KPI Digest</text>
    <text x="36" y="418" fill="#059669" font-size="9" font-weight="700">Target: 70%–80% of Total Repetitive Task Volume</text>
  </g>

  <!-- Gate 4 -> RIGHT: OUTCOME D (AMBER HUMAN-IN-THE-LOOP GATE) -->
  <path d="M 739 378 L 762 378 L 762 310" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#fc-arrow-amber)" />
  <rect x="742" y="356" width="36" height="16" rx="3" fill="#D97706" />
  <text x="760" y="367" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">HIGH</text>

  <g filter="url(#fc-shadow)">
    <rect x="735" y="196" width="141" height="106" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2.2" />
    <rect x="735" y="196" width="141" height="24" rx="8" fill="#D97706" />
    <rect x="735" y="210" width="141" height="10" fill="#D97706" />
    <text x="805" y="212" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">OUTCOME D: AMBER GATE</text>
    <text x="805" y="233" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">AI Draft + 1-Click</text>
    <text x="805" y="246" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">Human Approval</text>
    <text x="805" y="263" fill="#1E293B" font-size="8.5" text-anchor="middle">AI does 95% of prep;</text>
    <text x="805" y="276" fill="#1E293B" font-size="8.5" text-anchor="middle">Owner approves via</text>
    <text x="805" y="289" fill="#D97706" font-size="8.5" font-weight="700" text-anchor="middle">Slack/SMS in 15 sec</text>
  </g>

  <!-- Bottom Summary Bar -->
  <rect x="24" y="440" width="852" height="24" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="450" y="456" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">GOLDEN RULE OF SMALL BUSINESS AUTOMATION: Eliminate Waste First (Gate 1) -&gt; Score ROI (Gate 2) -&gt; Standardize Inputs (Gate 3) -&gt; Protect Margin &amp; Trust (Gate 4)</text>
</svg>
