<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow05f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#64748B"/>
    </marker>
    <marker id="arrowGreen05f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber05f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#D97706"/>
    </marker>
    <filter id="shadow05f" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- White Background -->
  <rect width="900" height="480" fill="#FFFFFF"/>

  <!-- Header Banner -->
  <rect x="0" y="0" width="900" height="52" fill="#0F172A"/>
  <text x="24" y="23" fill="#FFFFFF" font-size="13.5" font-weight="700">CHAPTER 5 DECISION TREE — INTAKE VERIFICATION, MISSING-ASSET CHASER &amp; DISPATCH GATE</text>
  <text x="24" y="40" fill="#64748B" font-size="10.5">Automated Prerequisite Validation, Day 1/3/5 Chaser Loop, Scope-Drift Check &amp; Crew/Project Provisioning</text>
  <rect x="736" y="13" width="140" height="26" rx="13" fill="#0284C7"/>
  <text x="806" y="30" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">READINESS HARD GATE</text>

  <!-- Node 1: Payment Webhook -->
  <g filter="url(#shadow05f)">
    <rect x="28" y="84" width="175" height="68" rx="8" fill="#0F172A"/>
    <text x="115" y="108" fill="#38BDF8" font-size="9.5" font-weight="700" text-anchor="middle">STEP 1: WEBHOOK TRIGGER</text>
    <text x="115" y="125" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Deposit / Invoice Paid</text>
    <text x="115" y="141" fill="#E2E8F0" font-size="9.5" text-anchor="middle">Stripe / Square / QBO / CRM</text>
  </g>
  <line x1="203" y1="118" x2="242" y2="118" stroke="#64748B" stroke-width="2" marker-end="url(#arrow05f)"/>

  <!-- Node 2: Welcome + Portal Provisioning -->
  <g filter="url(#shadow05f)">
    <rect x="248" y="84" width="185" height="68" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <text x="340" y="106" fill="#0284C7" font-size="9.5" font-weight="700" text-anchor="middle">STEP 2: INSTANT PROVISION</text>
    <text x="340" y="123" fill="#1E293B" font-size="11" font-weight="700" text-anchor="middle">Welcome + Intake Link</text>
    <text x="340" y="140" fill="#64748B" font-size="9.5" text-anchor="middle">Create Folder + Send Packet (5.2)</text>
  </g>
  <line x1="433" y1="118" x2="472" y2="118" stroke="#64748B" stroke-width="2" marker-end="url(#arrow05f)"/>

  <!-- Node 3: AI Intake Completeness Gate -->
  <g filter="url(#shadow05f)">
    <rect x="478" y="76" width="196" height="84" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
    <rect x="478" y="76" width="196" height="22" rx="6" fill="#059669"/>
    <text x="576" y="91" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">DECISION GATE A (PROMPT 5.3)</text>
    <text x="576" y="114" fill="#0F172A" font-size="11.5" font-weight="700" text-anchor="middle">Intake 100% Complete</text>
    <text x="576" y="130" fill="#0F172A" font-size="11.5" font-weight="700" text-anchor="middle">&amp; Assets Legible?</text>
    <text x="576" y="148" fill="#64748B" font-size="9.5" text-anchor="middle">Schema + Photo/File Audit</text>
  </g>

  <!-- Branch A1: Incomplete -> Missing Asset Chaser Loop -->
  <line x1="674" y1="118" x2="718" y2="118" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber05f)"/>
  <text x="696" y="110" fill="#D97706" font-size="9.5" font-weight="700" text-anchor="middle">NO</text>

  <g filter="url(#shadow05f)">
    <rect x="724" y="74" width="152" height="92" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="800" y="95" fill="#D97706" font-size="9.5" font-weight="700" text-anchor="middle">CHASER LOOP (5.3)</text>
    <text x="800" y="113" fill="#1E293B" font-size="10.5" font-weight="700" text-anchor="middle">Specific Item Request</text>
    <text x="800" y="129" fill="#1E293B" font-size="9.5" text-anchor="middle">Day 1: Friendly SMS/Email</text>
    <text x="800" y="144" fill="#1E293B" font-size="9.5" text-anchor="middle">Day 3: Direct Upload Link</text>
    <text x="800" y="159" fill="#D97706" font-size="9.5" font-weight="700" text-anchor="middle">Day 5: Staff Call Alert</text>
  </g>

  <!-- Branch A2: Complete -> Scope-Boundary Check -->
  <line x1="576" y1="160" x2="576" y2="212" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen05f)"/>
  <text x="598" y="190" fill="#059669" font-size="9.5" font-weight="700">YES (100%)</text>

  <!-- Node 4: Scope Boundary Gate -->
  <g filter="url(#shadow05f)">
    <rect x="478" y="218" width="196" height="84" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <rect x="478" y="218" width="196" height="22" rx="6" fill="#0284C7"/>
    <text x="576" y="233" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">DECISION GATE B (PROMPT 5.5)</text>
    <text x="576" y="256" fill="#0F172A" font-size="11.5" font-weight="700" text-anchor="middle">Intake Matches Signed</text>
    <text x="576" y="272" fill="#0F172A" font-size="11.5" font-weight="700" text-anchor="middle">SOW Scope Boundaries?</text>
    <text x="576" y="290" fill="#64748B" font-size="9.5" text-anchor="middle">Detects Unquoted Extras</text>
  </g>

  <!-- Branch B1: Scope Drift Detected -> Amber Change Order Gate -->
  <line x1="674" y1="260" x2="718" y2="260" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber05f)"/>
  <text x="696" y="252" fill="#D97706" font-size="9.5" font-weight="700" text-anchor="middle">DRIFT</text>

  <g filter="url(#shadow05f)">
    <rect x="724" y="218" width="152" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="800" y="238" fill="#D97706" font-size="9.5" font-weight="700" text-anchor="middle">AMBER CHANGE GATE</text>
    <text x="800" y="256" fill="#1E293B" font-size="10.5" font-weight="700" text-anchor="middle">Draft Change Order</text>
    <text x="800" y="272" fill="#1E293B" font-size="9.5" text-anchor="middle">Alert Account Manager</text>
    <text x="800" y="288" fill="#D97706" font-size="9.5" font-weight="700" text-anchor="middle">1-Click Approve Quote</text>
  </g>

  <!-- Branch B2: Scope Verified -> Green Zone Delivery Brief & Dispatch -->
  <line x1="576" y1="302" x2="576" y2="352" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen05f)"/>
  <text x="606" y="330" fill="#059669" font-size="9.5" font-weight="700">MATCHES SOW</text>

  <!-- Node 5: Compile Internal Delivery Brief -->
  <g filter="url(#shadow05f)">
    <rect x="466" y="358" width="220" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="576" y="378" fill="#059669" font-size="10" font-weight="700" text-anchor="middle">STEP 3: COMPILE DELIVERY BRIEF (5.1)</text>
    <text x="576" y="396" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">Provision Tasks &amp; Crew Board</text>
    <text x="576" y="413" fill="#1E293B" font-size="9.5" text-anchor="middle">Asana / ClickUp / Jobber / Notion</text>
    <text x="576" y="429" fill="#059669" font-size="9.5" font-weight="700" text-anchor="middle">Post Brief to #fulfillment-ops</text>
  </g>

  <!-- Left Flow: Calendar Release & Pre-Appointment Prep Sequence -->
  <line x1="466" y1="401" x2="422" y2="401" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen05f)"/>

  <g filter="url(#shadow05f)">
    <rect x="218" y="358" width="198" height="86" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <text x="317" y="378" fill="#0284C7" font-size="10" font-weight="700" text-anchor="middle">STEP 4: SCHEDULE &amp; PREP (5.4)</text>
    <text x="317" y="396" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">Release Kickoff / Dispatch</text>
    <text x="317" y="413" fill="#1E293B" font-size="9.5" text-anchor="middle">72h Prep Checklist + 24h Confirm</text>
    <text x="317" y="429" fill="#059669" font-size="9.5" font-weight="700" text-anchor="middle">2h En-Route / Meeting Link SMS</text>
  </g>

  <!-- Left Summary Box: Operational Guardrail Rules -->
  <rect x="28" y="188" width="405" height="142" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="28" y="188" width="405" height="26" rx="6" fill="#0F172A"/>
  <text x="42" y="205" fill="#FFFFFF" font-size="10.5" font-weight="700">ZERO-DROP ONBOARDING GOLDEN RULES</text>
  <text x="42" y="230" fill="#1E293B" font-size="10" font-weight="600">1. Never schedule a field crew or kickoff call before Gate A = 100%.</text>
  <text x="42" y="250" fill="#1E293B" font-size="10" font-weight="600">2. Chaser messages name the exact missing item (never generic).</text>
  <text x="42" y="270" fill="#1E293B" font-size="10" font-weight="600">3. Unquoted client requests in intake trigger Gate B Change Orders.</text>
  <text x="42" y="290" fill="#1E293B" font-size="10" font-weight="600">4. Delivery teams receive a 1-page structured brief—not raw email threads.</text>
  <text x="42" y="312" fill="#059669" font-size="10" font-weight="700">Result: 0% Unprepared Kickoffs | 74% Less Technician/Designer Rework</text>

  <!-- Bottom Left Badge -->
  <rect x="28" y="358" width="166" height="86" rx="8" fill="#059669"/>
  <text x="111" y="384" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">KICKOFF COMPLETE</text>
  <text x="111" y="403" fill="#ECFDF5" font-size="9.5" text-anchor="middle">Active Fulfillment State</text>
  <text x="111" y="421" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">Avg Time: 28 Hours</text>
</svg>
