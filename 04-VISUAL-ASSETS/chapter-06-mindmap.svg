<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="hubGrad06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow06m" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Pure White Canvas -->
  <rect width="900" height="480" fill="#FFFFFF"/>

  <!-- Top Header Banner -->
  <rect x="0" y="0" width="900" height="54" fill="#0F172A"/>
  <text x="28" y="24" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="0.5">CHAPTER 6 ARCHITECTURE — THE 3-TIER AI CUSTOMER SUPPORT SHIELD</text>
  <text x="28" y="42" fill="#64748B" font-size="11" font-weight="500">Single-Source Policy Grounding, Autonomous Tier-1 Resolution, Amber Assisted Drafts &amp; Red VIP Escalation</text>
  <rect x="734" y="14" width="142" height="26" rx="13" fill="#059669"/>
  <text x="805" y="31" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">TIER 1 SLA: &lt; 30 SEC</text>

  <!-- Outer Frame -->
  <rect x="20" y="66" width="860" height="394" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Connectors from Left Knowledge Hub to Center Classifier to Right 3 Tiers -->
  <line x1="274" y1="262" x2="328" y2="262" stroke="#0284C7" stroke-width="3"/>
  <path d="M 552 225 L 614 140" stroke="#059669" stroke-width="2.5" fill="none"/>
  <line x1="552" y1="262" x2="614" y2="262" stroke="#D97706" stroke-width="2.5"/>
  <path d="M 552 298 L 614 384" stroke="#0F172A" stroke-width="2.5" fill="none"/>

  <!-- LEFT COLUMN: GROUNDED KNOWLEDGE & LIVE DATA HUB -->
  <g filter="url(#shadow06m)">
    <rect x="36" y="86" width="238" height="352" rx="10" fill="#F8FAFC" stroke="#0284C7" stroke-width="2"/>
    <rect x="36" y="86" width="238" height="34" rx="8" fill="#0284C7"/>
    <text x="155" y="108" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">GROUNDED KNOWLEDGE HUB</text>

    <!-- Sub-box 1: Approved Policy Chunks -->
    <rect x="50" y="134" width="210" height="86" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="62" y="152" fill="#0F172A" font-size="10.5" font-weight="700">1. Single-Source Policy KB (6.1)</text>
    <text x="62" y="169" fill="#1E293B" font-size="9.5">• Shipping, Returns &amp; Warranty Rules</text>
    <text x="62" y="184" fill="#1E293B" font-size="9.5">• Service Prep &amp; Cancellation SLAs</text>
    <text x="62" y="199" fill="#0284C7" font-size="9.5" font-weight="600">• Versioned Markdown Policy Blocks</text>

    <!-- Sub-box 2: Read-Only Live Status API -->
    <rect x="50" y="232" width="210" height="86" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="62" y="250" fill="#0F172A" font-size="10.5" font-weight="700">2. Live Read-Only Data Lookups</text>
    <text x="62" y="267" fill="#1E293B" font-size="9.5">• Shopify / WooCommerce Order Status</text>
    <text x="62" y="282" fill="#1E293B" font-size="9.5">• Calendar / Field Appointment Slot</text>
    <text x="62" y="297" fill="#059669" font-size="9.5" font-weight="600">• CRM LTV &amp; VIP Account Tier Flag</text>

    <!-- Sub-box 3: Strict Anti-Hallucination Rules -->
    <rect x="50" y="330" width="210" height="92" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="62" y="348" fill="#0F172A" font-size="10.5" font-weight="700">3. Zero-Guess Guardrails</text>
    <text x="62" y="365" fill="#1E293B" font-size="9.5">• Temperature = 0.0 (Strict Facts)</text>
    <text x="62" y="380" fill="#1E293B" font-size="9.5">• Cite Policy ID or Escalate to Tier 2</text>
    <text x="62" y="395" fill="#D97706" font-size="9.5" font-weight="700">• Zero Autonomous Refund Promises</text>
    <text x="62" y="410" fill="#64748B" font-size="9">• Weekly Ticket Mining Loop</text>
  </g>

  <!-- CENTER HUB: INBOUND TRIAGE & SENTIMENT GATE -->
  <g filter="url(#shadow06m)">
    <rect x="328" y="182" width="224" height="160" rx="12" fill="url(#hubGrad06)" stroke="#0284C7" stroke-width="2.5"/>
    <rect x="364" y="171" width="152" height="20" rx="10" fill="#0284C7"/>
    <text x="440" y="185" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">OMNI-CHANNEL ROUTER (6.2)</text>
    <text x="440" y="214" fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle">SUPPORT SHIELD</text>
    <text x="440" y="232" fill="#38BDF8" font-size="11" font-weight="600" text-anchor="middle">TRIAGE &amp; SENTIMENT ENGINE</text>
    <line x1="348" y1="244" x2="532" y2="244" stroke="#334155" stroke-width="1"/>
    <text x="440" y="262" fill="#E2E8F0" font-size="10" text-anchor="middle">Email • SMS • Chat • WhatsApp • DM</text>
    <text x="440" y="280" fill="#10B981" font-size="10" font-weight="600" text-anchor="middle">Intent + Sentiment (-1.0 to +1.0)</text>
    <text x="440" y="298" fill="#FBBF24" font-size="10" font-weight="600" text-anchor="middle">Confidence Threshold &gt;= 0.90</text>
    <text x="440" y="318" fill="#94A3B8" font-size="9.5" text-anchor="middle">Risk &amp; Keyword Scanner</text>
  </g>

  <!-- RIGHT TIER 1: GREEN ZONE (60%-75% Volume) -->
  <g filter="url(#shadow06m)">
    <rect x="614" y="84" width="248" height="110" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <rect x="614" y="84" width="248" height="28" rx="6" fill="#059669"/>
    <text x="626" y="102" fill="#FFFFFF" font-size="10.5" font-weight="700">TIER 1: GREEN ZONE (60%–75% VOL)</text>
    <text x="626" y="126" fill="#0F172A" font-size="10.5" font-weight="700">Instant Autonomous Resolution (6.3)</text>
    <text x="626" y="143" fill="#1E293B" font-size="9.5">• Order Tracking &amp; Appointment Links</text>
    <text x="626" y="158" fill="#1E293B" font-size="9.5">• Grounded FAQ, Hours, Prep &amp; Sizing</text>
    <text x="626" y="176" fill="#059669" font-size="9.5" font-weight="700">SLA: &lt; 30 Seconds | Auto-Close + Log</text>
  </g>

  <!-- RIGHT TIER 2: AMBER ZONE (20%-30% Volume) -->
  <g filter="url(#shadow06m)">
    <rect x="614" y="208" width="248" height="110" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <rect x="614" y="208" width="248" height="28" rx="6" fill="#D97706"/>
    <text x="626" y="226" fill="#FFFFFF" font-size="10.5" font-weight="700">TIER 2: AMBER ZONE (20%–30% VOL)</text>
    <text x="626" y="250" fill="#0F172A" font-size="10.5" font-weight="700">AI-Drafted Human Approval (6.4)</text>
    <text x="626" y="267" fill="#1E293B" font-size="9.5">• Credits/Refunds Within Staff Limit</text>
    <text x="626" y="282" fill="#1E293B" font-size="9.5">• Complex Troubleshooting + Whisper</text>
    <text x="626" y="300" fill="#D97706" font-size="9.5" font-weight="700">SLA: &lt; 2 Hours | 1-Click Staff Approve</text>
  </g>

  <!-- RIGHT TIER 3: RED ZONE (5%-10% Volume) -->
  <g filter="url(#shadow06m)">
    <rect x="614" y="332" width="248" height="110" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="614" y="332" width="248" height="28" rx="6" fill="#0F172A"/>
    <text x="626" y="350" fill="#FFFFFF" font-size="10.5" font-weight="700">TIER 3: RED ZONE (5%–10% VOL)</text>
    <text x="626" y="374" fill="#0F172A" font-size="10.5" font-weight="700">Urgent VIP &amp; Safety Takeover (6.5)</text>
    <text x="626" y="391" fill="#1E293B" font-size="9.5">• Sentiment &lt; -0.5 or Legal/Chargeback</text>
    <text x="626" y="406" fill="#1E293B" font-size="9.5">• Suppress Auto-Reply + Alert Manager</text>
    <text x="626" y="424" fill="#0284C7" font-size="9.5" font-weight="700">SLA: &lt; 15 Mins | Executive Recovery Brief</text>
  </g>
</svg>
