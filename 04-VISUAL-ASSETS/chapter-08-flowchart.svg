<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow08f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#64748B"/>
    </marker>
    <marker id="arrowGreen08f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber08f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#D97706"/>
    </marker>
    <filter id="shadow08f" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- White Canvas -->
  <rect width="900" height="480" fill="#FFFFFF"/>

  <!-- Top Header Banner -->
  <rect x="0" y="0" width="900" height="52" fill="#0F172A"/>
  <text x="24" y="23" fill="#FFFFFF" font-size="13.5" font-weight="700">CHAPTER 8 DECISION TREE — AUTOMATED INVOICING, 5-STAGE CHASER &amp; VENDOR BILL TRIAGE</text>
  <text x="24" y="40" fill="#64748B" font-size="10.5">Accounts Receivable (AR) Escalation Ladder with Payment Stop-Logic + Accounts Payable (AP) OCR Variance Gate</text>
  <rect x="728" y="13" width="148" height="26" rx="13" fill="#059669"/>
  <text x="802" y="30" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">AR + AP AUTOMATION</text>

  <!-- ==================== TOP TRACK: ACCOUNTS RECEIVABLE (AR) ==================== -->
  <rect x="20" y="64" width="860" height="198" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="20" y="64" width="860" height="24" rx="6" fill="#059669"/>
  <text x="34" y="80" fill="#FFFFFF" font-size="10" font-weight="700">TRACK A: ACCOUNTS RECEIVABLE (AR) — MILESTONE INVOICING &amp; 5-STAGE PAYMENT CHASER LADDER (PROMPTS 8.1 &amp; 8.2)</text>

  <!-- AR Node 1: Job Completed -> Draft Invoice -->
  <g filter="url(#shadow08f)">
    <rect x="32" y="100" width="142" height="76" rx="6" fill="#0F172A"/>
    <text x="103" y="120" fill="#38BDF8" font-size="9" font-weight="700" text-anchor="middle">JOB SIGNED OFF</text>
    <text x="103" y="136" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">Format Invoice (8.1)</text>
    <text x="103" y="152" fill="#E2E8F0" font-size="9" text-anchor="middle">Send QBO/Stripe Link</text>
    <text x="103" y="166" fill="#10B981" font-size="8.5" font-weight="700" text-anchor="middle">SLA: &lt; 60 Seconds</text>
  </g>
  <line x1="174" y1="138" x2="196" y2="138" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen08f)"/>

  <!-- AR Node 2: Stage 1 & 2 (Green Auto) -->
  <g filter="url(#shadow08f)">
    <rect x="202" y="100" width="152" height="76" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <text x="278" y="118" fill="#059669" font-size="9" font-weight="700" text-anchor="middle">STAGES 1 &amp; 2 (GREEN)</text>
    <text x="278" y="134" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Day -3 &amp; Day +1</text>
    <text x="278" y="150" fill="#1E293B" font-size="9" text-anchor="middle">Polite SMS/Email Nudge</text>
    <text x="278" y="164" fill="#64748B" font-size="8.5" text-anchor="middle">1-Tap ACH / Card URL</text>
  </g>
  <line x1="354" y1="138" x2="376" y2="138" stroke="#64748B" stroke-width="2" marker-end="url(#arrow08f)"/>

  <!-- AR Node 3: Stage 3 (Day +7) -->
  <g filter="url(#shadow08f)">
    <rect x="382" y="100" width="152" height="76" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <text x="458" y="118" fill="#0284C7" font-size="9" font-weight="700" text-anchor="middle">STAGE 3 (DAY +7)</text>
    <text x="458" y="134" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Helpful Check-In</text>
    <text x="458" y="150" fill="#1E293B" font-size="9" text-anchor="middle">Re-attach PDF + Offer</text>
    <text x="458" y="164" fill="#0284C7" font-size="8.5" font-weight="700" text-anchor="middle">2-Part Split / Autopay</text>
  </g>
  <line x1="534" y1="138" x2="556" y2="138" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber08f)"/>

  <!-- AR Node 4: Stage 4 (Day +15 Amber Gate) -->
  <g filter="url(#shadow08f)">
    <rect x="562" y="100" width="148" height="76" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="636" y="118" fill="#D97706" font-size="9" font-weight="700" text-anchor="middle">STAGE 4 (DAY +15 AMBER)</text>
    <text x="636" y="134" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Owner 1-Click Gate</text>
    <text x="636" y="150" fill="#1E293B" font-size="9" text-anchor="middle">Firm Past-Due Notice</text>
    <text x="636" y="164" fill="#D97706" font-size="8.5" font-weight="700" text-anchor="middle">Work-Pause Warning</text>
  </g>
  <line x1="710" y1="138" x2="732" y2="138" stroke="#0F172A" stroke-width="2" marker-end="url(#arrow08f)"/>

  <!-- AR Node 5: Stage 5 (Day +30 Red Gate) -->
  <g filter="url(#shadow08f)">
    <rect x="738" y="100" width="130" height="76" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <text x="803" y="118" fill="#0F172A" font-size="9" font-weight="700" text-anchor="middle">STAGE 5 (DAY +30 RED)</text>
    <text x="803" y="134" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Pre-Collections</text>
    <text x="803" y="150" fill="#1E293B" font-size="9" text-anchor="middle">Late Fee Assessment</text>
    <text x="803" y="164" fill="#64748B" font-size="8.5" text-anchor="middle">Script 02 Escalation</text>
  </g>

  <!-- Instant Payment Webhook Stop Bar -->
  <rect x="32" y="190" width="836" height="58" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="450" y="210" fill="#059669" font-size="10" font-weight="700" text-anchor="middle">WEBHOOK GUARDRAIL: `invoice.paid` OR `dispute_flag == true` IMMEDIATELY TERMINATES ALL FUTURE CHASERS (&lt; 1 SEC)</text>
  <text x="450" y="228" fill="#1E293B" font-size="9.5" text-anchor="middle">Logs Payment in QBO/Xero -&gt; Sends Instant Paid Receipt PDF -&gt; Updates Friday Cashflow Scorecard</text>

  <!-- ==================== BOTTOM TRACK: ACCOUNTS PAYABLE (AP) & OCR ==================== -->
  <rect x="20" y="276" width="860" height="186" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="20" y="276" width="860" height="24" rx="6" fill="#0284C7"/>
  <text x="34" y="292" fill="#FFFFFF" font-size="10" font-weight="700">TRACK B: ACCOUNTS PAYABLE (AP) — VENDOR BILL OCR, PRICE-CREEP AUDITOR &amp; 5-DAY MONTHLY CLOSE (PROMPTS 8.3–8.5)</text>

  <!-- AP Node 1: Receipt / Bill Arrival -->
  <g filter="url(#shadow08f)">
    <rect x="32" y="316" width="166" height="84" rx="6" fill="#0F172A"/>
    <text x="115" y="338" fill="#38BDF8" font-size="9" font-weight="700" text-anchor="middle">INBOUND AP DOCUMENT</text>
    <text x="115" y="355" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">Vendor PDF / Staff Photo</text>
    <text x="115" y="372" fill="#94A3B8" font-size="9" text-anchor="middle">receipts@company.com</text>
    <text x="115" y="387" fill="#10B981" font-size="9" font-weight="600" text-anchor="middle">or SMS Field Upload</text>
  </g>
  <line x1="198" y1="358" x2="226" y2="358" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow08f)"/>

  <!-- AP Node 2: AI OCR & GL Mapper -->
  <g filter="url(#shadow08f)">
    <rect x="232" y="316" width="194" height="84" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <text x="329" y="336" fill="#0284C7" font-size="9" font-weight="700" text-anchor="middle">AI OCR EXTRACTOR (PROMPT 8.3)</text>
    <text x="329" y="353" fill="#0F172A" font-size="10.5" font-weight="700" text-anchor="middle">Parse Line Items &amp; Tax</text>
    <text x="329" y="370" fill="#1E293B" font-size="9" text-anchor="middle">Map Chart-of-Accounts GL Code</text>
    <text x="329" y="386" fill="#64748B" font-size="9" text-anchor="middle">+ Match Job/Client Cost Tag</text>
  </g>
  <line x1="426" y1="358" x2="454" y2="358" stroke="#64748B" stroke-width="2" marker-end="url(#arrow08f)"/>

  <!-- AP Node 3: Price-Creep & Duplicate Gate -->
  <g filter="url(#shadow08f)">
    <rect x="460" y="316" width="190" height="84" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5"/>
    <rect x="460" y="316" width="190" height="20" rx="5" fill="#D97706"/>
    <text x="555" y="330" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">VARIANCE GATE (PROMPT 8.4)</text>
    <text x="555" y="352" fill="#0F172A" font-size="10.5" font-weight="700" text-anchor="middle">Unit Price Hike &gt; 5% OR</text>
    <text x="555" y="368" fill="#0F172A" font-size="10.5" font-weight="700" text-anchor="middle">Duplicate Invoice ID?</text>
    <text x="555" y="386" fill="#64748B" font-size="9" text-anchor="middle">Compare vs. 90-Day Baseline</text>
  </g>

  <!-- Branch Top Right: Normal Bill -> Auto-Stage in QBO/Xero -->
  <path d="M 650 340 L 682 340" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrowGreen08f)"/>
  <text x="666" y="333" fill="#059669" font-size="8.5" font-weight="700" text-anchor="middle">PASS</text>

  <g filter="url(#shadow08f)">
    <rect x="688" y="308" width="180" height="62" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="778" y="327" fill="#059669" font-size="9" font-weight="700" text-anchor="middle">GREEN: STAGE IN QBO/XERO</text>
    <text x="778" y="343" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">Attach PDF + GL Coded</text>
    <text x="778" y="358" fill="#1E293B" font-size="8.5" text-anchor="middle">Ready for 5th-of-Month Close</text>
  </g>

  <!-- Branch Bottom Right: Variance > 5% -> Amber Alert -->
  <path d="M 650 378 L 682 378" stroke="#D97706" stroke-width="2" fill="none" marker-end="url(#arrowAmber08f)"/>
  <text x="666" y="391" fill="#D97706" font-size="8.5" font-weight="700" text-anchor="middle">FLAG</text>

  <g filter="url(#shadow08f)">
    <rect x="688" y="380" width="180" height="66" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="778" y="399" fill="#D97706" font-size="9" font-weight="700" text-anchor="middle">AMBER: VENDOR VARIANCE</text>
    <text x="778" y="415" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">Hold Payment &amp; Alert Owner</text>
    <text x="778" y="431" fill="#1E293B" font-size="8.5" text-anchor="middle">Pre-Drafted Vendor Dispute Email</text>
  </g>

  <!-- Bottom Left Pre-Close Bar -->
  <rect x="32" y="412" width="618" height="36" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
  <text x="341" y="434" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">DAY 1 OF MONTH: `Prompt 8.5` Audits Bank Feeds &amp; Chases Missing Staff Receipts so CPA Closes by Day 5</text>
</svg>
