    <text x="166" y="420" fill="#D97706" font-size="9.5" font-weight="700" text-anchor="middle">AMBER GATE: Missing/Scope Drift Flag</text>
  </g>

  <!-- STAGE 4: BOTTOM RIGHT (Navy #0F172A) -->
  <g filter="url(#shadow05m)">
    <rect x="606" y="294" width="256" height="142" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="606" y="294" width="256" height="30" rx="6" fill="#0F172A"/>
    <text x="618" y="313" fill="#FFFFFF" font-size="11" font-weight="700">STAGE 4: DELIVERY BRIEF &amp; DISPATCH</text>
    <text x="618" y="342" fill="#1E293B" font-size="10.5" font-weight="600">• AI Internal Delivery Brief (5.1)</text>
    <text x="618" y="360" fill="#1E293B" font-size="10.5">• Auto-Create Drive/Notion Folders</text>
    <text x="618" y="378" fill="#1E293B" font-size="10.5">• Task Board &amp; Crew Provisioning</text>
    <text x="618" y="396" fill="#1E293B" font-size="10.5">• Scope-Creep Guardrail Check (5.5)</text>
