  <!-- Bottom KPI Bar -->
  <rect x="330" y="352" width="240" height="84" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="450" y="370" fill="#0F172A" font-size="10.5" font-weight="700" text-anchor="middle">BENCHMARK ONBOARDING IMPACT</text>
  <text x="450" y="388" fill="#059669" font-size="10" font-weight="600" text-anchor="middle">Kickoff Time: 11 Days -&gt; 28 Hours</text>
  <text x="450" y="404" fill="#0284C7" font-size="10" font-weight="600" text-anchor="middle">Staff Rework Reduced by 74%</text>
  <text x="450" y="420" fill="#64748B" font-size="9.5" text-anchor="middle">No-Show Rate Cut Below 3.5%</text>
</svg>
