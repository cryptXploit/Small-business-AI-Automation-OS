  <rect x="24" y="324" width="852" height="26" rx="6" fill="#0284C7"/>
  <text x="450" y="341" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">AUTOMATED DORMANT CUSTOMER REACTIVATION &amp; REPEAT-BOOKING PIPELINE (PROMPT 7.4)</text>

