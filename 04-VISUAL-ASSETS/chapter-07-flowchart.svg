  <!-- Compliance Note Box (Middle Left) -->
  <rect x="24" y="176" width="286" height="116" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="38" y="196" fill="#0F172A" font-size="10" font-weight="700">FTC &amp; GOOGLE NON-GATING COMPLIANCE</text>
