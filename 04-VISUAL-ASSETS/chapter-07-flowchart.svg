    <text x="330" y="116" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">Send SMS + Email Pulse</text>
    <text x="330" y="134" fill="#64748B" font-size="9.5" text-anchor="middle">"How was your experience? (1–10)"</text>
