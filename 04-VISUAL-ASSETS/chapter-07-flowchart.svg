  <text x="38" y="246" fill="#1E293B" font-size="9.5">2. Instead, lead with immediate private owner</text>
  <text x="38" y="261" fill="#1E293B" font-size="9.5">   resolution while keeping public links accessible</text>
  <text x="38" y="276" fill="#059669" font-size="9.5" font-weight="700">   in the footer—resolving 85%+ privately.</text>
