    <text x="790" y="134" fill="#1E293B" font-size="9">• Auto-Draft SEO Reply (7.2)</text>
    <text x="790" y="149" fill="#059669" font-size="9" font-weight="700">• +14d VIP Referral Invite (7.5)</text>
