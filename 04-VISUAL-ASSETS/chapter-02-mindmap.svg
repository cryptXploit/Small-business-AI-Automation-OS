<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ch2m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="ch2m-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="ch2m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706" />
    </marker>
    <filter id="ch2m-shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Canvas & Frame -->
  <rect x="0" y="0" width="900" height="480" fill="#FFFFFF" />
  <rect x="8" y="8" width="884" height="464" rx="10" fill="none" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="8" y="8" width="884" height="46" rx="10" fill="#0F172A" />
  <rect x="8" y="38" width="884" height="16" fill="#0F172A" />
  <text x="26" y="31" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="0.4">CHAPTER 2 SYSTEM MINDMAP — THE T.R.A.V. HUMAN-IN-THE-LOOP SAFETY ARCHITECTURE</text>
  <text x="26" y="46" fill="#64748B" font-size="10" font-weight="500">Eliminating AI Hallucinations, Unauthorized Discounts &amp; Scheduling Errors via 4-Pillar Deterministic Governance</text>
  <rect x="730" y="18" width="146" height="24" rx="12" fill="#D97706" />
  <text x="803" y="34" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">T.R.A.V. SAFETY GATE</text>

  <!-- Connectors from Central Hub (450, 240) to 4 T.R.A.V. Quadrants -->
  <path d="M 332 205 C 295 205, 295 130, 275 130" fill="none" stroke="#0284C7" stroke-width="2.3" marker-end="url(#ch2m-cyan)" />
  <path d="M 568 205 C 605 205, 605 130, 625 130" fill="none" stroke="#059669" stroke-width="2.3" marker-end="url(#ch2m-emerald)" />
  <path d="M 332 285 C 295 285, 295 340, 275 340" fill="none" stroke="#059669" stroke-width="2.3" marker-end="url(#ch2m-emerald)" />
  <path d="M 568 285 C 605 285, 605 340, 625 340" fill="none" stroke="#D97706" stroke-width="2.3" marker-end="url(#ch2m-amber)" />

  <!-- Sequential Flow Arrows Around Perimeter (T -> R -> A -> V) -->
  <path d="M 275 95 L 625 95" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ch2m-emerald)" />
  <rect x="396" y="83" width="108" height="18" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="450" y="95" fill="#1E293B" font-size="8.5" font-weight="700" text-anchor="middle">1. CLEAN PAYLOAD</text>

  <path d="M 275 390 L 625 390" fill="none" stroke="#D97706" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ch2m-amber)" />
  <rect x="386" y="378" width="128" height="18" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1" />
  <text x="450" y="390" fill="#D97706" font-size="8.5" font-weight="700" text-anchor="middle">3. VALIDATED JSON DRAFT</text>

  <!-- CENTRAL HUB: THE T.R.A.V. GOVERNANCE ENGINE -->
  <g filter="url(#ch2m-shadow)">
    <rect x="332" y="146" width="236" height="196" rx="12" fill="#0F172A" stroke="#D97706" stroke-width="2.5" />
    <rect x="348" y="158" width="204" height="22" rx="5" fill="#059669" />
    <text x="450" y="173" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">ZERO-HALLUCINATION CORE</text>
    <text x="450" y="198" fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle">The T.R.A.V. Safety</text>
    <text x="450" y="215" fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle">Architecture</text>
    <line x1="348" y1="226" x2="552" y2="226" stroke="#64748B" stroke-width="1" />
    <text x="356" y="244" fill="#0284C7" font-size="9.5" font-weight="700">T:</text>
    <text x="372" y="244" fill="#FFFFFF" font-size="9.5">Trigger Normalization &amp; Dedup</text>
    <text x="356" y="261" fill="#059669" font-size="9.5" font-weight="700">R:</text>
    <text x="372" y="261" fill="#FFFFFF" font-size="9.5">Rules &amp; Pricebook Grounding</text>
    <text x="356" y="278" fill="#059669" font-size="9.5" font-weight="700">A:</text>
    <text x="372" y="278" fill="#FFFFFF" font-size="9.5">AI Strict JSON Output Contract</text>
    <text x="356" y="295" fill="#D97706" font-size="9.5" font-weight="700">V:</text>
    <text x="372" y="295" fill="#FFFFFF" font-size="9.5">Verification &amp; 3-Zone Routing</text>
    <rect x="348" y="306" width="204" height="24" rx="5" fill="#1E293B" stroke="#0284C7" stroke-width="1" />
    <text x="450" y="322" fill="#FFFFFF" font-size="9" font-weight="600" text-anchor="middle">Audit Trail + Kill-Switch + Fallback Queue</text>
  </g>

  <!-- PILLAR 1 (TOP LEFT): T — TRIGGER STANDARDIZATION -->
  <g filter="url(#ch2m-shadow)">
    <rect x="24" y="68" width="251" height="145" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <rect x="24" y="68" width="251" height="26" rx="8" fill="#0284C7" />
    <rect x="24" y="84" width="251" height="10" fill="#0284C7" />
    <text x="34" y="85" fill="#FFFFFF" font-size="10.5" font-weight="700">1. [T] TRIGGER STANDARDIZATION</text>
    <text x="34" y="108" fill="#0F172A" font-size="9.5" font-weight="700">Pre-Processing &amp; Event Hygiene</text>
    <text x="34" y="124" fill="#1E293B" font-size="9.5">• Idempotency Key (`event_hash`) Check</text>
    <text x="34" y="139" fill="#1E293B" font-size="9.5">• 60-Sec Duplicate Webhook Suppression</text>
    <text x="34" y="154" fill="#1E293B" font-size="9.5">• E.164 Phone &amp; ISO-8601 Timestamp Parse</text>
    <text x="34" y="169" fill="#1E293B" font-size="9.5">• PII Sanitization &amp; Null-Field Catch</text>
    <text x="34" y="187" fill="#0284C7" font-size="9" font-weight="700">Blocks Malformed &amp; Double-Fired Loops</text>
    <text x="34" y="202" fill="#64748B" font-size="8.5">Output: Validated Canonical Event Payload</text>
  </g>

  <!-- PILLAR 2 (TOP RIGHT): R — RULES & DETERMINISTIC CONTEXT -->
  <g filter="url(#ch2m-shadow)">
    <rect x="625" y="68" width="251" height="145" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2" />
    <rect x="625" y="68" width="251" height="26" rx="8" fill="#059669" />
    <rect x="625" y="84" width="251" height="10" fill="#059669" />
    <text x="635" y="85" fill="#FFFFFF" font-size="10.5" font-weight="700">2. [R] RULES &amp; CONTEXT GROUNDING</text>
    <text x="635" y="108" fill="#0F172A" font-size="9.5" font-weight="700">Code Filters Before AI Inference</text>
    <text x="635" y="124" fill="#1E293B" font-size="9.5">• VIP / Do-Not-Contact / Spam Blocklist</text>
    <text x="635" y="139" fill="#1E293B" font-size="9.5">• Deterministic Pricebook &amp; SKU Lookup</text>
    <text x="635" y="154" fill="#1E293B" font-size="9.5">• Approved SOP Snippet Retrieval Only</text>
    <text x="635" y="169" fill="#1E293B" font-size="9.5">• Hard Margin Floor &amp; Business Hours Check</text>
    <text x="635" y="187" fill="#059669" font-size="9" font-weight="700">AI Never Computes Math or Invents Policy</text>
    <text x="635" y="202" fill="#64748B" font-size="8.5">Output: Grounded Context Packet (`temp: 0.1`)</text>
  </g>

  <!-- PILLAR 3 (BOTTOM LEFT): A — AI STRUCTURED JSON SCHEMA -->
  <g filter="url(#ch2m-shadow)">
    <rect x="24" y="272" width="251" height="148" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2" />
    <rect x="24" y="272" width="251" height="26" rx="8" fill="#059669" />
    <rect x="24" y="288" width="251" height="10" fill="#059669" />
    <text x="34" y="289" fill="#FFFFFF" font-size="10.5" font-weight="700">3. [A] AI JSON SCHEMA ENGINE</text>
    <text x="34" y="312" fill="#0F172A" font-size="9.5" font-weight="700">Constrained Reasoning &amp; Validation</text>
    <text x="34" y="328" fill="#1E293B" font-size="9.5">• Strict System Role &amp; Negative Guardrails</text>
    <text x="34" y="343" fill="#1E293B" font-size="9.5">• Mandatory JSON Keys: `confidence_score`,</text>
    <text x="34" y="357" fill="#1E293B" font-size="9.5">  `risk_tier`, `policy_check_passed`, `draft`</text>
    <text x="34" y="372" fill="#1E293B" font-size="9.5">• Zero Unapproved Commitments Allowed</text>
    <text x="34" y="390" fill="#059669" font-size="9" font-weight="700">Pre-Flight Validator Scans Output Draft</text>
    <text x="34" y="405" fill="#64748B" font-size="8.5">Output: Schema-Verified JSON Response</text>
  </g>

  <!-- PILLAR 4 (BOTTOM RIGHT): V — VERIFICATION & 3-ZONE GATE -->
  <g filter="url(#ch2m-shadow)">
    <rect x="625" y="272" width="251" height="148" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2" />
    <rect x="625" y="272" width="251" height="26" rx="8" fill="#D97706" />
    <rect x="625" y="288" width="251" height="10" fill="#D97706" />
    <text x="635" y="289" fill="#FFFFFF" font-size="10.5" font-weight="700">4. [V] VERIFICATION &amp; 3-ZONE GATE</text>
    <text x="635" y="312" fill="#0F172A" font-size="9.5" font-weight="700">Risk-Tiered Execution &amp; Human Sign-Off</text>
    <text x="635" y="328" fill="#059669" font-size="9.5" font-weight="700">• GREEN ZONE: Auto-Send (&gt;=0.90 Conf.)</text>
    <text x="635" y="344" fill="#D97706" font-size="9.5" font-weight="700">• AMBER ZONE: 1-Click Slack/SMS Approve</text>
    <text x="635" y="360" fill="#0F172A" font-size="9.5" font-weight="700">• RED ZONE: Immediate Human Takeover</text>
    <text x="635" y="376" fill="#1E293B" font-size="9.5">• Dead-Letter Queue on API Timeout/Error</text>
    <text x="635" y="393" fill="#D97706" font-size="9" font-weight="700">15-Second Mobile Review for High Stakes</text>
    <text x="635" y="407" fill="#64748B" font-size="8.5">Output: Verified Customer Action + Audit Log</text>
  </g>

  <!-- Bottom Legend Footer -->
  <rect x="24" y="436" width="852" height="26" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <circle cx="42" cy="449" r="5" fill="#0284C7" />
  <text x="52" y="452" fill="#1E293B" font-size="9.5" font-weight="600">Trigger &amp; Schema Hygiene</text>
  <circle cx="215" cy="449" r="5" fill="#059669" />
  <text x="225" y="452" fill="#1E293B" font-size="9.5" font-weight="600">Deterministic Grounding &amp; Green Auto-Execution</text>
  <circle cx="505" cy="449" r="5" fill="#D97706" />
  <text x="515" y="452" fill="#1E293B" font-size="9.5" font-weight="600">Amber Gate (1-Click Staff Approval)</text>
  <circle cx="725" cy="449" r="5" fill="#0F172A" />
  <text x="735" y="452" fill="#1E293B" font-size="9.5" font-weight="600">Red Zone / Dead-Letter Alert</text>
</svg>
