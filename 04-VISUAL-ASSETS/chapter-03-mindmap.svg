    <text x="352" y="270" fill="#059669" font-size="9" font-weight="700">T:</text>
    <text x="366" y="270" fill="#FFFFFF" font-size="9">Text + Email 60-Sec First Touch</text>
    <text x="352" y="286" fill="#0284C7" font-size="9" font-weight="700">A:</text>
    <text x="366" y="286" fill="#FFFFFF" font-size="9">Automated Calendar / Territory Route</text>
    <text x="352" y="302" fill="#D97706" font-size="9" font-weight="700">N:</text>
