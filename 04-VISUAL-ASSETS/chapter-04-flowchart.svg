<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ch4f-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F172A" />
    </marker>
    <marker id="ch4f-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="ch4f-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="ch4f-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706" />
    </marker>
    <filter id="ch4f-shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.09" />
    </filter>
  </defs>

  <!-- Canvas & Frame -->
  <rect x="0" y="0" width="900" height="480" fill="#FFFFFF" />
  <rect x="8" y="8" width="884" height="464" rx="10" fill="none" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="8" y="8" width="884" height="46" rx="10" fill="#0F172A" />
  <rect x="8" y="38" width="884" height="16" fill="#0F172A" />
  <text x="26" y="31" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="0.4">CHAPTER 4 DECISION TREE — AUTOMATED ESTIMATING, MARGIN GATE &amp; NURTURE STOP-LOGIC</text>
  <text x="26" y="46" fill="#64748B" font-size="10" font-weight="500">Deterministic State Machine Governing 3-Tier Quote Generation, Gross Margin Guardrails &amp; 14-Day Multi-Touch Follow-Up</text>
  <rect x="730" y="18" width="146" height="24" rx="12" fill="#D97706" />
  <text x="803" y="34" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">MARGIN GUARDRAIL</text>

  <!-- STEP 1: DISCOVERY / SCOPE INPUT + PRICEBOOK LOOKUP -->
  <g filter="url(#ch4f-shadow)">
    <rect x="24" y="72" width="196" height="86" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="2" />
    <text x="122" y="92" fill="#0284C7" font-size="9.5" font-weight="700" text-anchor="middle">STEP 1: SCOPE + SKU MATCH</text>
    <text x="122" y="110" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">Run `Prompt 4.1` Against</text>
    <text x="122" y="124" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">Approved Price Matrix</text>
    <text x="122" y="143" fill="#CBD5E1" font-size="8.5" text-anchor="middle">Builds Tier 1, Tier 2 &amp; Tier 3 JSON</text>
  </g>

  <line x1="220" y1="115" x2="258" y2="115" stroke="#059669" stroke-width="2.2" marker-end="url(#ch4f-emerald)" />

  <!-- GATE 1: GROSS MARGIN FLOOR & CUSTOM SKU CHECK -->
  <g filter="url(#ch4f-shadow)">
    <rect x="264" y="72" width="214" height="86" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2" />
    <rect x="264" y="72" width="214" height="22" rx="8" fill="#059669" />
    <rect x="264" y="84" width="214" height="10" fill="#059669" />
    <text x="371" y="87" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">GATE 1: MARGIN FLOOR CHECK</text>
    <text x="371" y="108" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">Is Gross Margin &gt;= Floor (`48%`)</text>
    <text x="371" y="122" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">AND All SKUs in Pricebook?</text>
    <text x="371" y="142" fill="#64748B" font-size="8.5" text-anchor="middle">Blocks below-cost or unpriced quotes</text>
  </g>

  <!-- Gate 1 NO -> Estimator Exception Escalation (Below Gate 1 Left) -->
  <line x1="371" y1="158" x2="371" y2="196" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ch4f-amber)" />
  <rect x="315" y="166" width="112" height="15" rx="3" fill="#FFFFFF" stroke="#D97706" stroke-width="1" />
  <text x="371" y="177" fill="#D97706" font-size="8.5" font-weight="700" text-anchor="middle">NO (LOW MARGIN)</text>

  <g filter="url(#ch4f-shadow)">
    <rect x="24" y="202" width="454" height="62" rx="8" fill="#F8FAFC" stroke="#D97706" stroke-width="1.8" />
    <text x="38" y="222" fill="#0F172A" font-size="9.5" font-weight="700">EXCEPTION: HOLD QUOTE &amp; FLAG ESTIMATOR FOR CUSTOM PRICING</text>
    <text x="38" y="238" fill="#1E293B" font-size="9">Highlights missing custom SKU or labor underestimate; recalculates price to hit target margin floor.</text>
    <text x="38" y="253" fill="#D97706" font-size="8.5" font-weight="700">Prevents accidental underbidding on complex commercial or custom orders.</text>
  </g>

  <!-- Gate 1 YES -> GATE 2: AMBER MOBILE SIGN-OFF (Right Top) -->
  <line x1="478" y1="115" x2="520" y2="115" stroke="#D97706" stroke-width="2.2" marker-end="url(#ch4f-amber)" />
  <rect x="482" y="96" width="32" height="15" rx="3" fill="#059669" />
  <text x="498" y="107" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">PASS</text>

  <g filter="url(#ch4f-shadow)">
    <rect x="526" y="72" width="350" height="86" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2.2" />
    <rect x="526" y="72" width="350" height="22" rx="8" fill="#D97706" />
    <rect x="526" y="84" width="350" height="10" fill="#D97706" />
    <text x="701" y="87" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">GATE 2: AMBER 1-CLICK OWNER APPROVAL CARD</text>
    <text x="701" y="108" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">Assemble Narrative (`Prompt 4.2`) -&gt; Push Slack/SMS Card</text>
    <text x="701" y="123" fill="#1E293B" font-size="9" text-anchor="middle">Owner taps `[Approve &amp; Send]` (15s) -&gt; E-Sign Quote + SMS Sent</text>
    <text x="701" y="142" fill="#059669" font-size="8.5" font-weight="700" text-anchor="middle">Starts 14-Day Multi-Touch Nurture Loop (`Prompt 4.3`)</text>
  </g>

  <!-- Gate 2 -> GATE 3: 14-DAY NURTURE STATE MACHINE (Downward) -->
  <line x1="701" y1="158" x2="701" y2="196" stroke="#059669" stroke-width="2.2" marker-end="url(#ch4f-emerald)" />

  <g filter="url(#ch4f-shadow)">
    <rect x="526" y="202" width="350" height="62" rx="8" fill="#0F172A" stroke="#059669" stroke-width="2" />
    <text x="701" y="222" fill="#059669" font-size="9.5" font-weight="700" text-anchor="middle">GATE 3: REAL-TIME WEBHOOK EVENT LISTENER (DAYS 1–14)</text>
    <text x="701" y="239" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">Before Every Scheduled Touch (Days 2, 4, 7, 10, 14):</text>
    <text x="701" y="254" fill="#CBD5E1" font-size="9" text-anchor="middle">Check CRM Deal Status: `Signed` vs. `Replied_Objection` vs. `Silent`</text>
  </g>

  <!-- 3 Downward Branches from Gate 3 -->
  <path d="M 580 264 L 160 288 L 160 314" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#ch4f-emerald)" />
  <path d="M 675 264 L 455 288 L 455 314" fill="none" stroke="#0284C7" stroke-width="2.2" marker-end="url(#ch4f-cyan)" />
  <line x1="750" y1="264" x2="750" y2="314" stroke="#D97706" stroke-width="2.2" marker-end="url(#ch4f-amber)" />

  <!-- OUTCOME 1 (LEFT): QUOTE SIGNED / DEPOSIT PAID -->
  <g filter="url(#ch4f-shadow)">
    <rect x="24" y="320" width="268" height="106" rx="8" fill="#0F172A" stroke="#059669" stroke-width="2.2" />
    <rect x="36" y="330" width="244" height="20" rx="4" fill="#059669" />
    <text x="158" y="344" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">STATE A: SIGNED / DEPOSIT PAID</text>
    <text x="36" y="366" fill="#FFFFFF" font-size="9.5" font-weight="700">Immediate Stop-on-Sign Kill Switch</text>
    <text x="36" y="382" fill="#CBD5E1" font-size="9">• Cancels all remaining Day 2–14 follow-ups</text>
    <text x="36" y="396" fill="#CBD5E1" font-size="9">• Marks CRM Deal `CLOSED_WON` + Option Tier</text>
    <text x="36" y="410" fill="#CBD5E1" font-size="9">• Fires Dept 03 Zero-Drop Onboarding Webhook</text>
    <text x="36" y="421" fill="#059669" font-size="8.5" font-weight="700">Zero awkward follow-ups sent to paying clients</text>
  </g>

  <!-- OUTCOME 2 (CENTER): PROSPECT REPLIES WITH PRICE / SCOPE QUESTION -->
  <g filter="url(#ch4f-shadow)">
    <rect x="308" y="320" width="284" height="106" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <rect x="308" y="320" width="284" height="23" rx="8" fill="#0284C7" />
    <rect x="308" y="333" width="284" height="10" fill="#0284C7" />
    <text x="450" y="336" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">STATE B: REPLIED / PRICE OBJECTION</text>
    <text x="320" y="358" fill="#0F172A" font-size="9.5" font-weight="700">Pause Sequence &amp; Run `Prompt 4.4`</text>
    <text x="320" y="374" fill="#1E293B" font-size="9">• Pauses automated sequence immediately</text>
    <text x="320" y="388" fill="#1E293B" font-size="9">• Drafts Scope-Adjusted Tier 1 or Phased Option</text>
    <text x="320" y="402" fill="#1E293B" font-size="9">• Routes revised quote via Amber Approval Gate</text>
    <text x="320" y="417" fill="#0284C7" font-size="8.5" font-weight="700">Closes budget-conscious buyers without discounting</text>
  </g>

  <!-- OUTCOME 3 (RIGHT): SILENT PROSPECT CADENCE + DAY 14 TRIGGER -->
  <g filter="url(#ch4f-shadow)">
    <rect x="608" y="320" width="268" height="106" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2" />
    <rect x="608" y="320" width="268" height="23" rx="8" fill="#D97706" />
    <rect x="608" y="333" width="268" height="10" fill="#D97706" />
    <text x="742" y="336" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">STATE C: SILENT -&gt; 6-TOUCH LOOP</text>
    <text x="620" y="358" fill="#0F172A" font-size="9.5" font-weight="700">Execute Scheduled Touch (`Prompts 4.3/4.5`)</text>
    <text x="620" y="374" fill="#1E293B" font-size="9">• Sends Day 2 FAQ, Day 4 Case Study, Day 7/10</text>
    <text x="620" y="388" fill="#1E293B" font-size="9">• Day 14: Fires Polite "Close-the-File" Trigger</text>
    <text x="620" y="402" fill="#1E293B" font-size="9">• If no reply by Day 21 -&gt; 90-Day Reactivation</text>
    <text x="620" y="417" fill="#D97706" font-size="8.5" font-weight="700">Recovers 18%–26% of stalled silent quotes</text>
  </g>

  <!-- Bottom Footer -->
  <rect x="24" y="440" width="852" height="24" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="450" y="456" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">QUOTING GOLDEN RULE: Never Discount Price Without Removing Scope — Use Tier 1 (Essential) to Preserve Gross Margin</text>
</svg>
