  <!-- Bottom Center Summary Box -->
  <rect x="330" y="348" width="240" height="88" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="450" y="367" fill="#0F172A" font-size="10.5" font-weight="700" text-anchor="middle">7-BLOCK LIVING SOP STANDARD</text>
  <text x="450" y="384" fill="#1E293B" font-size="9.5" text-anchor="middle">1. Purpose • 2. Trigger • 3. Tools/Access</text>
  <text x="450" y="400" fill="#1E293B" font-size="9.5" text-anchor="middle">4. Steps • 5. Definition of Done (QA)</text>
  <text x="450" y="416" fill="#059669" font-size="9.5" font-weight="700" text-anchor="middle">6. Exceptions • 7. Escalation Owner</text>
