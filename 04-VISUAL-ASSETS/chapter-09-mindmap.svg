  <text x="28" y="42" fill="#64748B" font-size="11" font-weight="500">5-Minute Loom/Voice Capture, 7-Block SOP Compiler, Grounded Staff Q&amp;A Bot &amp; 7-Day New-Hire Certification</text>
  <rect x="726" y="14" width="148" height="26" rx="13" fill="#059669"/>
  <text x="800" y="31" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">-79% OWNER INTERRUPTS</text>

  <!-- Outer Frame -->
  <rect x="20" y="66" width="860" height="394" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Connectors from Center Hub to 4 Quadrants -->
  <path d="M 338 240 L 285 162" stroke="#059669" stroke-width="2.5" fill="none"/>
  <path d="M 562 240 L 615 162" stroke="#0284C7" stroke-width="2.5" fill="none"/>
  <path d="M 338 285 L 285 358" stroke="#D97706" stroke-width="2.5" fill="none"/>
  <path d="M 562 285 L 615 358" stroke="#0F172A" stroke-width="2.5" fill="none"/>

  <!-- CENTRAL HUB NODE -->
  <g filter="url(#shadow09m)">
