    <text x="50" y="132" fill="#1E293B" font-size="10" font-weight="600">• 3-Min Screen Share or Voice Note</text>
    <text x="50" y="150" fill="#1E293B" font-size="10">• AI Compiler (Prompt 9.1): 7 Blocks</text>
    <text x="50" y="168" fill="#1E293B" font-size="10">• Trigger, Tools, Steps &amp; QA Checklist</text>
