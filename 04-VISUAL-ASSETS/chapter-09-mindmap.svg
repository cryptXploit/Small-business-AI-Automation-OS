    <rect x="606" y="294" width="256" height="30" rx="6" fill="#0F172A"/>
    <text x="618" y="313" fill="#FFFFFF" font-size="10.5" font-weight="700">4. 7-DAY NEW-HIRE CERTIFICATION</text>
    <text x="618" y="342" fill="#1E293B" font-size="10" font-weight="600">• Role-Specific Daily Curriculum (9.5)</text>
