    <rect x="372" y="191" width="156" height="20" rx="10" fill="#0284C7"/>
    <text x="450" y="205" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">DEPT 05 TEAM &amp; SOP CORE</text>
    <text x="450" y="235" fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle">LIVING SOP &amp;</text>
    <text x="450" y="253" fill="#38BDF8" font-size="11.5" font-weight="600" text-anchor="middle">DELEGATION ENGINE</text>
    <line x1="352" y1="265" x2="548" y2="265" stroke="#334155" stroke-width="1"/>
    <text x="450" y="283" fill="#E2E8F0" font-size="10" text-anchor="middle">Record Task Once -&gt; Delegated Forever</text>
    <text x="450" y="301" fill="#10B981" font-size="10" font-weight="600" text-anchor="middle">New-Hire Ramp: 8 Wks -&gt; 14 Days</text>
