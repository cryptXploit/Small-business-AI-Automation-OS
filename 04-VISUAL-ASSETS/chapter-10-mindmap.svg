<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="hubGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow10m" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Pure White Canvas -->
  <rect width="900" height="480" fill="#FFFFFF"/>

  <!-- Top Header Banner -->
  <rect x="0" y="0" width="900" height="54" fill="#0F172A"/>
  <text x="28" y="24" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="0.5">CHAPTER 10 ARCHITECTURE — 15-MINUTE FRIDAY OWNER SCORECARD &amp; 90-DAY ROLLOUT ENGINE</text>
  <text x="28" y="42" fill="#64748B" font-size="11" font-weight="500">12 Executive KPIs Across All 5 Departments, Friday 3:00 PM AI Variance Brief &amp; 3-Phase 90-Day Sprint</text>
  <rect x="726" y="14" width="148" height="26" rx="13" fill="#059669"/>
  <text x="800" y="31" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">FRIDAY 3:00 PM PULSE</text>

  <!-- Outer Frame -->
  <rect x="20" y="66" width="860" height="394" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Radial Spokes from Center Hub to 6 Nodes -->
  <line x1="340" y1="220" x2="270" y2="140" stroke="#059669" stroke-width="2.5"/>
  <line x1="450" y1="194" x2="450" y2="164" stroke="#0284C7" stroke-width="2.5"/>
  <line x1="560" y1="220" x2="630" y2="140" stroke="#059669" stroke-width="2.5"/>
  <line x1="340" y1="290" x2="270" y2="365" stroke="#D97706" stroke-width="2.5"/>
  <line x1="450" y1="322" x2="450" y2="348" stroke="#0284C7" stroke-width="2.5"/>
  <line x1="560" y1="290" x2="630" y2="365" stroke="#0F172A" stroke-width="2.5"/>

  <!-- CENTER HUB NODE -->
  <g filter="url(#shadow10m)">
    <rect x="334" y="194" width="232" height="128" rx="14" fill="url(#hubGrad10)" stroke="#059669" stroke-width="2.5"/>
    <rect x="368" y="183" width="164" height="20" rx="10" fill="#059669"/>
    <text x="450" y="197" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">EXECUTIVE COMMAND CENTER</text>
    <text x="450" y="226" fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle">15-MINUTE FRIDAY</text>
    <text x="450" y="245" fill="#38BDF8" font-size="12" font-weight="700" text-anchor="middle">OWNER SCORECARD (10.1)</text>
    <line x1="354" y1="257" x2="546" y2="257" stroke="#334155" stroke-width="1"/>
    <text x="450" y="275" fill="#E2E8F0" font-size="9.5" text-anchor="middle">12 Core KPIs • Red/Amber/Green Triage</text>
    <text x="450" y="293" fill="#10B981" font-size="10" font-weight="600" text-anchor="middle">3 Decisions for Monday 15-Min Huddle</text>
    <text x="450" y="310" fill="#FBBF24" font-size="9" font-weight="600" text-anchor="middle">Owner Hours: 62h -&gt; 31h/Week</text>
  </g>

  <!-- NODE 1 (TOP LEFT): DEPT 01 — LEAD CAPTURE KPIS -->
  <g filter="url(#shadow10m)">
    <rect x="34" y="78" width="246" height="98" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <rect x="34" y="78" width="246" height="26" rx="6" fill="#059669"/>
    <text x="46" y="95" fill="#FFFFFF" font-size="10" font-weight="700">DEPT 01: LEAD CAPTURE KPIS</text>
    <text x="46" y="118" fill="#1E293B" font-size="9.5" font-weight="600">1. Total Qualified Inbound Leads</text>
    <text x="46" y="135" fill="#1E293B" font-size="9.5">2. Median Speed-to-Lead (&lt; 60 Sec)</text>
    <text x="46" y="152" fill="#059669" font-size="9.5" font-weight="700">3. % Missed Calls Recovered via SMS</text>
  </g>

  <!-- NODE 2 (TOP CENTER): DEPT 02 — SALES & QUOTING KPIS -->
  <g filter="url(#shadow10m)">
    <rect x="327" y="74" width="246" height="90" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <rect x="327" y="74" width="246" height="26" rx="6" fill="#0284C7"/>
    <text x="339" y="91" fill="#FFFFFF" font-size="10" font-weight="700">DEPT 02: SALES &amp; QUOTING KPIS</text>
    <text x="339" y="114" fill="#1E293B" font-size="9.5" font-weight="600">4. Total 3-Tier Quotes Dispatched</text>
    <text x="339" y="131" fill="#1E293B" font-size="9.5">5. Quote Turnaround Time (&lt; 15 Min)</text>
    <text x="339" y="148" fill="#0284C7" font-size="9.5" font-weight="700">6. 14-Day Quote-to-Close Rate (%)</text>
  </g>

  <!-- NODE 3 (TOP RIGHT): DEPT 03 — FULFILLMENT & SUPPORT KPIS -->
  <g filter="url(#shadow10m)">
    <rect x="620" y="78" width="246" height="98" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <rect x="620" y="78" width="246" height="26" rx="6" fill="#059669"/>
    <text x="632" y="95" fill="#FFFFFF" font-size="10" font-weight="700">DEPT 03: CX, SUPPORT &amp; REVIEWS</text>
    <text x="632" y="118" fill="#1E293B" font-size="9.5" font-weight="600">7. Onboarding Kickoff Cycle (&lt; 36h)</text>
    <text x="632" y="135" fill="#1E293B" font-size="9.5">8. Tier 1 AI Auto-Resolution (65%+)</text>
    <text x="632" y="152" fill="#059669" font-size="9.5" font-weight="700">9. Net New 5★ Reviews &amp; CSAT (95%+)</text>
  </g>

  <!-- NODE 4 (BOTTOM LEFT): DEPT 04 — BILLING & CASHFLOW KPIS -->
  <g filter="url(#shadow10m)">
    <rect x="34" y="344" width="246" height="100" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <rect x="34" y="344" width="246" height="26" rx="6" fill="#D97706"/>
    <text x="46" y="361" fill="#FFFFFF" font-size="10" font-weight="700">DEPT 04: BILLING &amp; CASHFLOW KPIS</text>
    <text x="46" y="384" fill="#1E293B" font-size="9.5" font-weight="600">10. Weekly Cash Collected ($) vs. Billed</text>
    <text x="46" y="401" fill="#1E293B" font-size="9.5">11. Overdue AR &gt; 15 Days ($) &amp; DSO</text>
    <text x="46" y="418" fill="#D97706" font-size="9.5" font-weight="700">    Target DSO &lt; 15 Days | Vendor Flags</text>
  </g>

  <!-- NODE 5 (BOTTOM CENTER): DEPT 05 — TEAM & SYSTEM HEALTH -->
  <g filter="url(#shadow10m)">
    <rect x="327" y="348" width="246" height="96" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <rect x="327" y="348" width="246" height="26" rx="6" fill="#0284C7"/>
    <text x="339" y="365" fill="#FFFFFF" font-size="10" font-weight="700">DEPT 05: TEAM &amp; SYSTEM HEALTH</text>
    <text x="339" y="388" fill="#1E293B" font-size="9.5" font-weight="600">12. Owner Hours Worked (&lt;= 35h/Wk)</text>
    <text x="339" y="405" fill="#1E293B" font-size="9.5">• Weekly Staff Hours Saved &amp; ROI (10.3)</text>
    <text x="339" y="422" fill="#0284C7" font-size="9.5" font-weight="700">• New Living SOPs &amp; Exception Count</text>
  </g>

  <!-- NODE 6 (BOTTOM RIGHT): 90-DAY PHASED ROLLOUT ROADMAP -->
  <g filter="url(#shadow10m)">
    <rect x="620" y="344" width="246" height="100" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="620" y="344" width="246" height="26" rx="6" fill="#0F172A"/>
    <text x="632" y="361" fill="#FFFFFF" font-size="10" font-weight="700">90-DAY PHASED SPRINT (PROMPT 10.2)</text>
    <text x="632" y="384" fill="#059669" font-size="9.5" font-weight="700">• Days 1–30: Revenue &amp; Speed-to-Lead</text>
    <text x="632" y="401" fill="#0284C7" font-size="9.5" font-weight="700">• Days 31–60: CX, Support &amp; Cashflow</text>
    <text x="632" y="418" fill="#0F172A" font-size="9.5" font-weight="700">• Days 61–90: Living SOPs &amp; Scorecard</text>
  </g>
</svg>
