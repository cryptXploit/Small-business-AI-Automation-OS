  <text x="135" y="1000" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">a week—and up to thirty-five percent of your leads—not because you're lazy, but because you're acting as the human router between every app, quote, and employee.</text>
